# Postgres local para desenvolvimento (o app usa PostgreSQL em todos os
# ambientes). Suba com `docker compose up -d` e use no .env:
# DATABASE_URL="postgresql://tdm:tdm@localhost:5432/tdm_sorteios"
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tdm
      POSTGRES_PASSWORD: tdm
      POSTGRES_DB: tdm_sorteios
    ports:
      - "5432:5432"
    volumes:
      - tdm_pgdata:/var/lib/postgresql/data

volumes:
  tdm_pgdata:
